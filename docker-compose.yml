services:
  postgres:
    image: postgres:16
    container_name: empleatech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: empleatech_mvp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empleatech_mvp"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - empleatech_pgdata:/var/lib/postgresql/data

volumes:
  empleatech_pgdata:

