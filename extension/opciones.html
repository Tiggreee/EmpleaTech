<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>EmpleaTech</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 16px; min-width: 320px; color: #111; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #bbb; border-radius: 8px; }
      button { margin-top: 10px; padding: 8px 14px; border: 0; border-radius: 8px; background: #22d3ee; font-weight: 600; cursor: pointer; }
      p { color: #555; }
    </style>
  </head>
  <body>
    <label for="base">Dirección de tu EmpleaTech</label>
    <input id="base" type="url" placeholder="http://localhost:3000" />
    <label for="token" style="margin-top: 12px">Token de conexión (solo si tu EmpleaTech vive en internet)</label>
    <input id="token" type="password" autocomplete="off" placeholder="Pégalo desde la página Autollenado de tu EmpleaTech" />
    <button id="guardar" type="button">Guardar</button>
    <p id="estado" role="status"></p>
    <p>La extensión llena formularios con tu perfil. Nunca envía nada: el botón «Enviar» siempre lo presionas tú.</p>
    <script src="opciones.js"></script>
  </body>
</html>
